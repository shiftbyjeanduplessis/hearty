<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0057ff">
  <title>Hearty — Offline</title>
  <link rel="manifest" href="/manifest.json">
  <link rel="apple-touch-icon" href="/icons/hearty-icon-192.png">
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:22px;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;color:#102033;background:linear-gradient(180deg,#f8fbff,#edf5ff)}
    .card{width:min(100%,440px);padding:30px 24px;border:1px solid #e2eaf4;background:#fff;border-radius:28px;box-shadow:0 18px 46px rgba(15,30,50,.08);text-align:center}.logo{height:46px;width:auto;margin-bottom:22px}.card h1{font-size:1.48rem;line-height:1.15;margin:0 0 10px}.card p{margin:0 0 22px;color:#63758b;line-height:1.55}.btn{display:inline-flex;justify-content:center;text-decoration:none;padding:13px 19px;border-radius:999px;background:#1767c7;color:#fff;font-weight:800}.small{font-size:.82rem;margin-top:20px;color:#71839a}
  </style>
</head>
<body>
  <main class="card">
    <img class="logo" src="/hearty-logo.png" alt="Hearty">
    <h1>You are offline</h1>
    <p>Reconnect to the internet, then reopen Hearty. Pages you have already used may still be available offline.</p>
    <a class="btn" href="/home.html">Try again</a>
    <div class="small">For account or access support, visit the Help Centre once you are online.</div>
  </main>
</body>
</html>
