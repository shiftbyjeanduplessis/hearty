  <script>
    (function(){

        soft_rose:'/assets/logos/hearty-logo-champagne-blush-floral.png',
        deep_berry:'/assets/logos/hearty-logo-aurora-pop.png'
      };
      function normalise(raw){
        var value=String(raw||'').trim().toLowerCase().replace(/[-\s]+/g,'_');
        var valid={clean_blue:1,pink_lemonade:1,midnight:1,soft_rose:1,deep_berry:1};
        var legacy={sunlit:'pink_lemonade',fresh_green:'clean_blue',rose_aurora:'soft_rose',rose:'soft_rose',cleanblue:'clean_blue',clean:'clean_blue',blue:'clean_blue',pink:'pink_lemonade',lemonade:'pink_lemonade',berry:'deep_berry',deepberry:'deep_berry'};
        return valid[value]?value:(legacy[value]||'clean_blue');
      }
      function readTheme(){
        try{return normalise(localStorage.getItem('heartyTheme')||localStorage.getItem('hearty-theme')||document.documentElement.getAttribute('data-theme')||'clean_blue');}
        catch(e){return 'clean_blue';}
      }
      function sync(){
        var theme=(window.heartyReadTheme&&window.heartyReadTheme())||readTheme();
        theme=normalise(theme);
        document.documentElement.setAttribute('data-theme',theme);
        if(document.body) document.body.setAttribute('data-theme',theme);
        var logo=document.getElementById('onboardingLogo');
        if(logo){
          var fromTheme=(window.heartyLogoForTheme&&window.heartyLogoForTheme(theme))||null;
          var src=(fromTheme&&fromTheme.src)?('/'+String(fromTheme.src).replace(/^\//,'')):(logos[theme]||'/hearty-logo.png');
          logo.src=src;
          logo.onerror=function(){this.onerror=null;this.src='/hearty-logo.png';};
        }
      }
      document.addEventListener('DOMContentLoaded',sync);
      window.addEventListener('hearty:theme-change',sync);
      window.addEventListener('storage',function(e){if(e.key==='heartyTheme'||e.key==='hearty-theme')sync();});
      sync();
    })();
  </script>
