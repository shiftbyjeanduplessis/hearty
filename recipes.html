<style>

  :root,
  html[data-theme="clean_blue"]{
    --recipe-card:rgba(255,255,255,.94);
    --recipe-card-soft:rgba(255,255,255,.72);
    --recipe-line:rgba(121,145,168,.22);
    --recipe-ink:#112033;
    --recipe-muted:#5d6f83;
    --recipe-accent:#1167b1;
    --recipe-breakfast:#f59e0b;
    --recipe-lunch:#10a37f;
    --recipe-dinner:#7c3aed;
    --recipe-snack:#e93578;
    --recipe-shadow:0 18px 42px rgba(13,35,56,.09);
    --recipe-soft-shadow:0 10px 26px rgba(13,35,56,.06);
  }
  html[data-theme="pink_lemonade"]{
    --recipe-accent:#d91d63;
    --recipe-breakfast:#f59e0b;
    --recipe-lunch:#0f9f7a;
    --recipe-dinner:#7c3aed;
    --recipe-snack:#d91d63;
  }
  html[data-theme="midnight"]{

    --recipe-muted:rgba(232,238,248,.72);
    --recipe-accent:#7dd3fc;
    --recipe-breakfast:#fbbf24;
    --recipe-lunch:#34d399;
    --recipe-dinner:#a78bfa;
    --recipe-snack:#fb7185;
    --recipe-shadow:0 22px 54px rgba(0,0,0,.34);

  }
  html[data-theme="soft_rose"]{

    --recipe-breakfast:#b7791f;
    --recipe-lunch:#108665;
    --recipe-dinner:#7c3aed;
    --recipe-snack:#c0567a;
  }
  html[data-theme="deep_berry"]{
    --recipe-accent:#8b5cf6;
    --recipe-breakfast:#f59e0b;
    --recipe-lunch:#10b981;

  *{box-sizing:border-box}

  .recipes-card h2,.recipes-card h3,.recipe-card h3,.recipe-modal-content h2{margin:0;color:var(--recipe-ink);letter-spacing:-.035em;line-height:1.08}
  .muted{color:var(--recipe-muted);line-height:1.52}.small{font-size:.86rem}

  .recipe-category-breakfast{--cat-color:var(--recipe-breakfast);--cat-bg:rgba(245,158,11,.12)}
  .recipe-category-lunch{--cat-color:var(--recipe-lunch);--cat-bg:rgba(16,163,127,.11)}

  html[data-theme="midnight"] .recipe-category-lunch{--cat-bg:rgba(52,211,153,.14)}
  html[data-theme="midnight"] .recipe-category-dinner{--cat-bg:rgba(167,139,250,.16)}
  html[data-theme="midnight"] .recipe-category-snack{--cat-bg:rgba(251,113,133,.15)}

  .recipes-hero{padding:26px;overflow:hidden;position:relative;background:linear-gradient(135deg,rgba(255,255,255,.96),rgba(236,248,255,.86));}
  html[data-theme="midnight"] .recipes-hero{background:linear-gradient(135deg,rgba(20,24,42,.92),rgba(34,30,68,.72));}
  .recipes-hero::before{content:"";position:absolute;inset:auto -90px -120px auto;width:300px;height:300px;border-radius:50%;background:radial-gradient(circle,rgba(17,103,177,.13),transparent 66%);pointer-events:none;}
  .recipes-hero-top{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:18px;align-items:start;position:relative;z-index:1}
  .recipes-hero .page-heading{font-size:clamp(2.2rem,5.8vw,4.15rem);letter-spacing:-.055em;line-height:.95;margin-top:10px;}
  .recipes-hero .subline{font-size:clamp(1rem,2.1vw,1.18rem);max-width:680px;}
  .recipe-hero-icon{width:54px;height:54px;border-radius:18px;display:grid;place-items:center;background:rgba(17,103,177,.08);border:1px solid rgba(17,103,177,.14);box-shadow:var(--recipe-soft-shadow);color:var(--recipe-accent);}
  .recipe-hero-icon svg{width:29px;height:29px;fill:none;stroke:currentColor;stroke-width:1.85;stroke-linecap:round;stroke-linejoin:round;}

  .recipe-search-wrap{position:relative;z-index:1;margin-top:22px;display:grid;gap:13px;}
  .recipe-search-shell{display:grid;grid-template-columns:auto minmax(0,1fr);align-items:center;gap:12px;border-radius:999px;background:rgba(255,255,255,.82);border:1px solid var(--recipe-line);box-shadow:0 12px 28px rgba(13,35,56,.065);padding:5px 16px;}
  html[data-theme="midnight"] .recipe-search-shell{background:rgba(255,255,255,.08)}
  .recipe-search-shell svg{width:21px;height:21px;color:var(--recipe-muted);fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;}
  input[type="search"],select{width:100%;border:0;background:transparent;color:var(--recipe-ink);font:inherit;outline:none;}
  input[type="search"]{min-height:48px;font-size:1rem;}
  .recipe-filter-row{display:flex;gap:9px;flex-wrap:wrap;align-items:center;}
  .recipe-filter-row button,.recipe-secondary,.recipe-primary{font:inherit;cursor:pointer;transition:.18s ease;}
  .recipe-filter-row button{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--recipe-line);background:rgba(255,255,255,.66);color:var(--recipe-muted);border-radius:999px;padding:9px 13px;font-weight:850;font-size:.84rem;}
  html[data-theme="midnight"] .recipe-filter-row button{background:rgba(255,255,255,.07)}
  .recipe-filter-row button.active{background:var(--recipe-accent);border-color:var(--recipe-accent);color:#fff;box-shadow:0 12px 24px rgba(17,103,177,.16)}
  .recipe-filter-row button:active,.recipe-primary:active,.recipe-secondary:active,.idea-card:active{transform:scale(.985)}

  .category-line{display:flex;align-items:center;gap:8px;color:var(--cat-color);font-size:.75rem;font-weight:950;letter-spacing:.07em;text-transform:uppercase;}
  .category-badge{width:28px;height:28px;border-radius:10px;display:inline-grid;place-items:center;background:var(--cat-bg);border:1px solid color-mix(in srgb,var(--cat-color) 22%,transparent);color:var(--cat-color);flex:0 0 auto;}
  .category-badge svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;}
  @supports not (color: color-mix(in srgb, red 20%, transparent)){.category-badge{border-color:var(--recipe-line)}}
  .recipe-meta-line{color:var(--recipe-muted);font-size:.88rem;font-weight:750;line-height:1.45;}
  .recipe-tag-line{color:var(--recipe-muted);font-size:.78rem;line-height:1.35;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}

  .featured-recipe{display:grid;gap:13px;padding:24px 24px 22px;border-left:6px solid var(--cat-color);}

  .featured-label{width:max-content;}
  .featured-body h2{font-size:clamp(1.75rem,3.2vw,2.55rem);}
  .recipe-primary,.recipe-secondary{min-height:44px;border-radius:15px;padding:11px 15px;font-weight:950;border:1px solid transparent;}
  .recipe-primary{background:linear-gradient(180deg,var(--recipe-accent),#0c579a);color:#fff;box-shadow:0 12px 26px rgba(17,103,177,.18);}
  .recipe-secondary{background:rgba(17,103,177,.09);color:var(--recipe-accent);border-color:rgba(17,103,177,.14);}

  .quick-ideas-row{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;}
  .idea-card{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:12px;padding:14px;border-radius:22px;background:var(--recipe-card);border:1px solid var(--recipe-line);border-left:4px solid var(--cat-color);box-shadow:var(--recipe-soft-shadow);text-align:left;cursor:pointer;color:var(--recipe-ink);font:inherit;}
  .idea-card strong{display:block;letter-spacing:-.025em;line-height:1.12}.idea-card span{display:block;color:var(--recipe-muted);font-size:.85rem;margin-top:3px}
  .idea-icon{width:36px;height:36px;border-radius:13px;display:grid;place-items:center;background:var(--cat-bg);border:1px solid var(--recipe-line);color:var(--cat-color);}
  .idea-icon svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.85;stroke-linecap:round;stroke-linejoin:round;}
  .idea-arrow{width:28px;height:28px;border-radius:999px;display:grid;place-items:center;background:var(--cat-bg);color:var(--cat-color);font-weight:950;}

  .recipe-section-head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;margin:4px 0 0;}
  .recipe-section-head h2{margin:0;color:var(--recipe-ink);letter-spacing:-.04em;font-size:1.6rem;}
  .recipes-body{display:grid;grid-template-columns:minmax(0,1fr) minmax(280px,.46fr);gap:18px;align-items:start;}
  .recipe-list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;}
  .recipe-card{position:relative;display:grid;gap:11px;padding:16px 15px 15px 17px;border-radius:23px;background:var(--recipe-card);border:1px solid var(--recipe-line);border-left:5px solid var(--cat-color);box-shadow:var(--recipe-soft-shadow);align-items:start;}
  .recipe-card h3{font-size:1.08rem;margin:0 0 5px;}.recipe-card p{margin:0}.recipe-card .muted{font-size:.88rem;line-height:1.45}
  .recipe-card-body{display:grid;gap:9px;min-width:0;}.recipe-card-top{display:flex;align-items:center;justify-content:space-between;gap:10px;}
  .recipe-open-mini{border:0;background:transparent;color:var(--cat-color);font-weight:950;padding:0;white-space:nowrap;cursor:pointer;}
  .recipes-empty{grid-column:1/-1;text-align:center;padding:26px;border-radius:24px;background:var(--recipe-card);border:1px solid var(--recipe-line);box-shadow:var(--recipe-soft-shadow);}

  .quick-panel{padding:18px;display:grid;gap:14px;position:sticky;top:92px;}
  .quick-panel h3{font-size:1.25rem}.quick-panel select{min-height:46px;border:1px solid var(--recipe-line);background:var(--recipe-card-soft);border-radius:16px;padding:0 12px;}
  .meal-result{display:grid;gap:10px;padding:14px;border-radius:20px;background:var(--recipe-card-soft);border:1px solid var(--recipe-line);border-left:4px solid var(--cat-color, var(--recipe-accent));}
  .meal-result h3{font-size:1.04rem}.meal-result p{margin:0}.meal-structure{display:inline-flex;width:max-content;max-width:100%;padding:6px 9px;border-radius:999px;color:var(--cat-color,var(--recipe-accent));background:var(--cat-bg,rgba(17,103,177,.09));border:1px solid var(--recipe-line);font-size:12px;font-weight:850}html[data-theme="midnight"] .meal-structure{color:var(--cat-color,var(--recipe-accent))}
  .meal-idea-list{display:grid;gap:10px}.meal-idea-list[hidden]{display:none!important}.meal-option-card{display:grid;gap:8px;padding:12px;border-radius:18px;background:var(--recipe-card-soft);border:1px solid var(--recipe-line);border-left:4px solid var(--cat-color,var(--recipe-accent))}.meal-option-card h3{font-size:.98rem}

  .recipe-modal{border:0;padding:0;background:transparent;max-width:min(92vw,740px);width:740px}.recipe-modal::backdrop{background:rgba(2,6,23,.58);backdrop-filter:blur(3px)}
  .recipe-modal-content{position:relative;background:var(--recipe-card);border:1px solid var(--recipe-line);border-left:6px solid var(--cat-color,var(--recipe-accent));border-radius:28px;box-shadow:0 24px 80px rgba(0,0,0,.22);padding:24px;color:var(--recipe-ink);max-height:min(84vh,760px);overflow:auto}.recipe-modal-content ul,.recipe-modal-content ol{padding-left:21px;line-height:1.55;color:var(--recipe-muted)}.recipe-modal-content li{margin:7px 0}.recipe-modal-content h3{margin:20px 0 8px;color:var(--recipe-ink)}.recipe-modal-close{position:absolute;right:14px;top:14px;width:38px;height:38px;border-radius:999px;border:1px solid var(--recipe-line);background:var(--recipe-card-soft);font-size:24px;line-height:1;color:var(--recipe-muted);cursor:pointer}.modal-title-row{display:grid;gap:11px;margin-right:42px}
  .recipe-toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);z-index:90;max-width:min(92vw,440px);padding:12px 14px;border-radius:16px;background:rgba(16,32,51,.94);color:white;box-shadow:0 16px 38px rgba(15,23,42,.24);font-size:13px;line-height:1.4;display:none}.recipe-toast.show{display:block}
  button:disabled{opacity:.72;cursor:wait}
  @media (max-width:1080px){.recipes-body{grid-template-columns:1fr}.quick-panel{position:relative;top:auto;order:-1}.recipe-list{grid-template-columns:repeat(2,minmax(0,1fr))}.quick-ideas-row{grid-template-columns:1fr 1fr 1fr}}
  @media (max-width:760px){.recipes-page{gap:14px}.recipes-hero{padding:22px 18px;border-radius:24px}.recipes-hero-top{grid-template-columns:1fr}.recipe-hero-icon{width:48px;height:48px;border-radius:16px}.recipes-hero .page-heading{font-size:2.55rem}.featured-recipe{padding:20px 18px;border-radius:24px}.quick-ideas-row{grid-template-columns:1fr}.recipe-section-head{align-items:flex-start;display:grid}.recipe-list{grid-template-columns:1fr}.recipe-card{border-radius:22px}.recipe-filter-row{flex-wrap:nowrap;overflow:auto;padding-bottom:4px;margin-right:-18px}.recipe-filter-row button{white-space:nowrap}.modal-title-row{grid-template-columns:1fr;margin-right:42px}.recipe-modal-content{border-radius:22px;padding:20px 16px}.status-strip{margin-bottom:0}}
  @media (max-width:440px){.recipe-card{padding:15px 14px 14px 16px}.recipe-meta-line{font-size:.82rem}.recipe-search-shell{border-radius:22px}.recipes-hero .page-heading{font-size:2.32rem}}


  /* v81: align with Hearty app typography and keep default recipe list quiet */
  .recipes-page,
  .recipes-page button,
  .recipes-page input,
  .recipes-page select,
  .recipe-modal-content{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;}
  .recipes-card h2,
  .recipes-card h3,
  .recipe-card h3,
  .recipe-modal-content h2,
  .recipe-section-head h2,
  .recipes-hero .page-heading{letter-spacing:-.025em;line-height:1.12;}
  .recipes-hero .page-heading{font-size:clamp(2rem,4.8vw,3.15rem);line-height:1.02;margin-top:8px;}
  .featured-body h2{font-size:clamp(1.45rem,2.6vw,2.05rem);letter-spacing:-.025em;line-height:1.12;}
  .recipe-section-head h2{font-size:1.35rem;}
  .recipe-card h3{font-size:1.02rem;letter-spacing:-.015em;}
  .recipes-hero .subline{font-size:1rem;line-height:1.5;}
  .category-line{letter-spacing:.045em;font-size:.72rem;}
  .recipe-meta-line{font-weight:650;}
  .recipe-filter-row button{font-weight:800;}
  .recipe-primary,.recipe-secondary{font-weight:850;}
  .recipe-prompt-card{min-height:154px;display:grid;place-content:center;gap:8px;}
  .recipe-prompt-card h3{font-size:1.16rem;}
  @media (max-width:760px){
    .recipes-hero .page-heading{font-size:2.18rem;}
    .featured-body h2{font-size:1.38rem;}
  }


  /* v82: simplify Recipes page. No quick idea block, no bare text on background, no inline SVG category icons. */
  .recipe-hero-icon{display:none!important;}
  .recipe-search-shell{grid-template-columns:minmax(0,1fr)!important;}
  .recipe-search-shell svg{display:none!important;}
  .recipes-hero-top{grid-template-columns:1fr!important;}
  .recipes-body{display:grid!important;grid-template-columns:1fr!important;gap:16px;}
  .recipe-library{padding:20px;display:grid;gap:16px;}
  .recipe-section-head{margin:0;align-items:start;}
  .recipe-list{margin-top:0;}
  .recipes-empty{background:var(--recipe-card-soft);box-shadow:none;}
  .category-badge{font-size:.72rem;font-weight:950;letter-spacing:.02em;line-height:1;}
  .category-badge svg{display:none!important;}
  .quick-ideas-row,.quick-panel{display:none!important;}
  @media (max-width:760px){
    .recipe-library{padding:18px 16px;border-radius:24px;}
    .recipe-section-head{gap:8px;}
    .recipe-section-head .small{margin:0;}
  }

<body data-page="recipes">
<div class="shell"><div data-shell-mount="topbar"></div>
<main class="recipes-page">
  <section class="recipes-hero recipes-card" aria-label="Recipes overview">
    <div class="recipes-hero-top">
      <div>
        <div class="eyebrow">RECIPES</div>
        <h1 class="page-heading">Recipe library</h1>
        <p class="subline">Search or browse simple high-protein ideas without scrolling through a giant recipe dump.</p>
      </div>
      <div class="recipe-hero-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24"><path d="M4 5.5c2.2-.9 4.7-.9 7.5.1v14c-2.8-1-5.3-1-7.5-.1z"></path><path d="M12.5 5.6c2.8-1 5.3-1 7.5-.1v14c-2.2-.9-4.7-.9-7.5.1z"></path><path d="M8 8v7"></path><path d="M6.6 8v3"></path><path d="M9.4 8v3"></path><path d="M16 8c1.2 1.2 1.2 3.4 0 4.2V15"></path></svg>
      </div>
    </div>
    <div class="recipe-search-wrap">
      <label class="recipe-search-shell" for="recipeSearch">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.6-3.6"></path></svg>
        <input id="recipeSearch" type="search" placeholder="Search recipes, ingredients or meals..." autocomplete="off" />
      </label>
      <div class="recipe-filter-row" id="recipeFilters" aria-label="Recipe filters"></div>
    </div>
  </section>

  <section id="featuredRecipe" class="featured-recipe recipes-card" aria-label="Featured recipe"></section>

  <section class="recipes-body" aria-label="Recipe library">
    <section class="recipe-library recipes-card" aria-label="All recipes">
      <div class="recipe-section-head">
        <div>
          <div class="eyebrow">RECIPE BOOK</div>
          <h2 id="recipeLibraryTitle">Find recipes</h2>
        </div>
        <p class="small muted" id="recipeCount">Search or choose a category</p>
      </div>
      <div id="recipeList" class="recipe-list" aria-live="polite"></div>
    </section>
  </section>
</main>

<dialog id="recipeModal" class="recipe-modal" aria-label="Recipe details">
  <div id="recipeModalContent" class="recipe-modal-content"></div>
</dialog>
<div class="recipe-toast" id="recipeToast" role="status" aria-live="polite"></div>

</div>
