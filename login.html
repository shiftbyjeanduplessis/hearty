<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Hearty Login</title>
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#0057ff">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Hearty">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="apple-touch-icon" href="/icons/hearty-icon-192.png">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/glp-supabase-config.js"></script>
  <style>
    :root{--login-ink:#102033;--login-muted:#5d6f7e;--login-line:rgba(180,200,220,.5);--login-card:rgba(255,255,255,.9);--login-blue:#1167d8;--login-blue-deep:#0756c8;--login-shadow:0 24px 70px rgba(50,80,110,.18)}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:radial-gradient(900px 420px at 0% 0%,rgba(47,109,246,.10),transparent 55%),radial-gradient(900px 460px at 100% 100%,rgba(20,184,166,.09),transparent 55%),linear-gradient(180deg,#f7fbff,#eef5fb);display:flex;align-items:center;justify-content:center;padding:24px;color:var(--login-ink)}
    .auth-card{width:100%;max-width:430px;background:var(--login-card);border:1px solid var(--login-line);border-radius:30px;box-shadow:var(--login-shadow);padding:34px 26px 30px;text-align:center;backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px)}
    .auth-logo{height:64px;width:auto;max-width:300px;object-fit:contain;display:block;margin:0 auto 10px}
    .auth-tagline{font-size:.98rem;font-weight:650;color:var(--login-muted)}
    .auth-title{margin:14px 0 8px;font-size:1.9rem;line-height:1.05;font-weight:800;letter-spacing:-.04em}
    .subtitle{color:var(--login-muted);font-size:15px;margin-bottom:22px;line-height:1.5}
    input{width:100%;border-radius:16px;border:1px solid #d7e2ec;padding:15px 16px;font-size:16px;margin-bottom:14px;outline:none;background:rgba(255,255,255,.96);color:var(--login-ink)}
    input:focus{border-color:rgba(17,103,216,.45);box-shadow:0 0 0 4px rgba(17,103,216,.10)}
    button{width:100%;border:0;border-radius:16px;padding:15px 16px;font-size:16px;font-weight:700;cursor:pointer;margin-top:8px;transition:.18s ease}
    button:active{transform:scale(.985)}button:disabled{opacity:.55;cursor:not-allowed;transform:none}
    .primary{background:linear-gradient(180deg,var(--login-blue),var(--login-blue-deep));color:white;box-shadow:0 12px 24px rgba(17,103,216,.25)}
    .ghost{background:white;color:#123;border:1px solid #d7e2ec}
    .message{margin-top:18px;font-size:14px;color:var(--login-muted);min-height:22px;line-height:1.4;white-space:pre-wrap}
    .debug{display:none;margin-top:12px;padding:10px;border-radius:12px;background:rgba(220,38,38,.08);color:#991b1b;font-size:12px;text-align:left;word-break:break-word}
    @media(max-width:560px){body{padding:18px}.auth-card{padding:30px 20px 26px;border-radius:28px}.auth-logo{height:56px}.auth-title{font-size:1.75rem}}
  
    .login-splash{
      position:fixed;
      inset:0;
      z-index:9999;
      display:block;
      background:#0057ff url("/assets/hearty-splash-screen.png") center center / cover no-repeat;
      opacity:0;
      pointer-events:none;
      transition:opacity .22s ease;
    }
    .login-splash.show{
      opacity:1;
      pointer-events:auto;
    }


    .auth-actions{display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap;margin-top:12px}
    .text-link{border:0;background:transparent;color:var(--login-blue);font-size:14px;font-weight:800;padding:6px 8px;margin:0;box-shadow:none;width:auto;cursor:pointer}
    .text-link:hover{text-decoration:underline}
    .reset-panel{display:none;margin-top:18px;padding-top:18px;border-top:1px solid rgba(180,200,220,.55);text-align:left}
    .reset-panel.show{display:block}
    .reset-title{font-size:1.05rem;font-weight:850;letter-spacing:-.02em;margin:0 0 6px;color:var(--login-ink)}
    .reset-copy{font-size:14px;line-height:1.45;color:var(--login-muted);margin:0 0 14px}
    .reset-panel .primary,.reset-panel .ghost{width:100%}

  </style>
</head>
<body>
  <main class="auth-card">
    <img src="/hearty-logo.png" alt="Hearty" class="auth-logo" />
    <div class="auth-tagline">Your GLP-1 Companion</div>

    <section id="signinPanel">
      <h1 class="auth-title">Welcome back</h1>
      <div class="subtitle">Sign in to continue your journey with Hearty.</div>
      <input id="email" type="email" placeholder="Email address" autocomplete="email" />
      <button class="primary" id="sendBtn" type="button">Continue with email</button>
      <button class="ghost" id="googleBtn" type="button">Continue with Google</button>
      <div class="auth-actions">
        <button class="text-link" id="forgotPasswordBtn" type="button">Forgot password?</button>
      </div>
    </section>

    <section class="reset-panel" id="forgotPanel">
      <h2 class="reset-title">Reset your password</h2>
      <p class="reset-copy">Enter your account email and we’ll send you a secure reset link.</p>
      <input id="resetEmail" type="email" placeholder="Email address" autocomplete="email" />
      <button class="primary" id="resetSendBtn" type="button">Send reset link</button>
      <button class="ghost" id="backToLoginBtn" type="button">Back to login</button>
    </section>

    <section class="reset-panel" id="newPasswordPanel">
      <h2 class="reset-title">Choose a new password</h2>
      <p class="reset-copy">Enter a new password for your Hearty account.</p>
      <input id="newPassword" type="password" placeholder="New password" autocomplete="new-password" />
      <input id="confirmPassword" type="password" placeholder="Confirm new password" autocomplete="new-password" />
      <button class="primary" id="savePasswordBtn" type="button">Save new password</button>
    </section>

    <div class="message" id="message"></div>
    <div class="debug" id="debug"></div>
  </main>

  <div class="login-splash" id="loginSplash" aria-live="polite" aria-hidden="true"></div>


  <script>
    (function(){
      const emailInput = document.getElementById('email');
      const sendBtn = document.getElementById('sendBtn');
      const googleBtn = document.getElementById('googleBtn');
      const forgotPasswordBtn = document.getElementById('forgotPasswordBtn');
      const signinPanel = document.getElementById('signinPanel');
      const forgotPanel = document.getElementById('forgotPanel');
      const newPasswordPanel = document.getElementById('newPasswordPanel');
      const resetEmail = document.getElementById('resetEmail');
      const resetSendBtn = document.getElementById('resetSendBtn');
      const backToLoginBtn = document.getElementById('backToLoginBtn');
      const newPassword = document.getElementById('newPassword');
      const confirmPassword = document.getElementById('confirmPassword');
      const savePasswordBtn = document.getElementById('savePasswordBtn');
      const message = document.getElementById('message');
      const debug = document.getElementById('debug');

      const supabase = window.supabaseClient || window.heartySupabase;
      let redirecting = false;
      let recoveryMode = false;

      function setMessage(text){ message.textContent = text || ''; }
      function setBusy(isBusy){
        [sendBtn, googleBtn, resetSendBtn, savePasswordBtn].forEach(btn => { if(btn) btn.disabled = isBusy; });
      }
      function showSplash(text){
        const splash = document.getElementById('loginSplash');
        if(splash){
          splash.classList.add('show');
          splash.setAttribute('aria-hidden','false');
        }
      }
      function hideSplash(){
        const splash = document.getElementById('loginSplash');
        if(splash){
          splash.classList.remove('show');
          splash.setAttribute('aria-hidden','true');
        }
      }
      function showDebug(label, err){
        console.error(label, err);
        debug.style.display = 'block';
        debug.textContent = label + ': ' + (err && (err.message || JSON.stringify(err))) ;
      }
      function clearDebug(){
        debug.style.display = 'none';
        debug.textContent = '';
      }
      function showLogin(){
        recoveryMode = false;
        signinPanel.hidden = false;
        forgotPanel.classList.remove('show');
        newPasswordPanel.classList.remove('show');
        setMessage('');
        clearDebug();
      }
      function showForgot(){
        recoveryMode = false;
        signinPanel.hidden = true;
        newPasswordPanel.classList.remove('show');
        forgotPanel.classList.add('show');
        resetEmail.value = resetEmail.value || emailInput.value || '';
        setMessage('');
        clearDebug();
      }
      function showNewPassword(){
        recoveryMode = true;
        signinPanel.hidden = true;
        forgotPanel.classList.remove('show');
        newPasswordPanel.classList.add('show');
        setMessage('Enter your new password.');
        clearDebug();
      }
      function cleanUrl(){
        if (window.history && (window.location.hash || window.location.search)) {
          window.history.replaceState({}, document.title, '/login.html');
        }
      }

      if (!supabase || !supabase.auth) {
        setMessage('Login connection failed. Check /glp-supabase-config.js.');
        setBusy(true);
        showDebug('Missing Supabase client', { hasSupabaseLibrary: !!window.supabase, hasSupabaseClient: !!window.supabaseClient });
        return;
      }

      async function ensureProfile(){
        try {
          const { data, error } = await supabase.auth.getUser();
          if (error) throw error;
          const user = data && data.user;
          if (!user) return;
          const provider = user.app_metadata?.provider || 'email';
          await supabase.from('profiles').upsert({
            user_id: user.id,
            account_email: user.email,
            user_name: user.user_metadata?.full_name || user.email || null,
            first_name: user.user_metadata?.full_name?.split(' ')?.[0] || null,
            auth_provider: provider,
            updated_at: new Date().toISOString()
          }, { onConflict: 'user_id' });
        } catch (err) {
          console.warn('[Hearty Login] Profile save skipped:', err);
        }
      }

      async function sendToHome(){
        if (redirecting || recoveryMode) return;
        redirecting = true;
        setBusy(true);
        showSplash('Opening Hearty…');
        setMessage('Signing you in...');
        await ensureProfile();
        cleanUrl();
        window.location.replace('/home.html');
      }

      function getHashParams(){
        const raw = window.location.hash ? window.location.hash.slice(1) : '';
        return new URLSearchParams(raw);
      }
      function getSearchParams(){
        return new URLSearchParams(window.location.search || '');
      }
      function isRecoveryLink(){
        const hash = getHashParams();
        const search = getSearchParams();
        return hash.get('type') === 'recovery' || search.get('type') === 'recovery' || search.get('recovery') === 'true';
      }

      async function handleMagicLinkHash(){
        const params = getHashParams();
        const access_token = params.get('access_token');
        const refresh_token = params.get('refresh_token');
        if (!access_token || !refresh_token) return false;

        setBusy(true);
        setMessage(isRecoveryLink() ? 'Opening password reset...' : 'Completing sign in...');

        const { data, error } = await supabase.auth.setSession({ access_token, refresh_token });
        if (error) throw error;

        if (data && data.session) {
          if (isRecoveryLink()) {
            hideSplash();
            setBusy(false);
            cleanUrl();
            showNewPassword();
            return true;
          }
          await sendToHome();
          return true;
        }
        return false;
      }

      async function handleCodeRedirect(){
        if (!window.location.search.includes('code=')) return false;
        setBusy(true);
        setMessage(isRecoveryLink() ? 'Opening password reset...' : 'Completing sign in...');
        const { data, error } = await supabase.auth.exchangeCodeForSession(window.location.href);
        if (error) throw error;

        if (data && data.session) {
          if (isRecoveryLink()) {
            hideSplash();
            setBusy(false);
            cleanUrl();
            showNewPassword();
            return true;
          }
          await sendToHome();
          return true;
        }
        return false;
      }

      async function checkExistingSession(){
        try {
          showSplash('Checking sign in…');
          setMessage('Checking sign in...');
          if (await handleMagicLinkHash()) return;
          if (await handleCodeRedirect()) return;

          const { data, error } = await supabase.auth.getSession();
          if (error) throw error;
          if (data && data.session && !isRecoveryLink()) {
            await sendToHome();
            return;
          }

          setMessage('');
          hideSplash();
          setBusy(false);
        } catch (err) {
          setMessage('Could not complete sign in. Try the link again or use Google.');
          hideSplash();
          setBusy(false);
          showDebug('Auth redirect error', err);
        }
      }

      sendBtn.addEventListener('click', async function(){
        const email = emailInput.value.trim();
        if (!email) { setMessage('Please enter your email address.'); return; }
        try {
          setBusy(true);
          clearDebug();
          setMessage('Sending login link...');
          const { error } = await supabase.auth.signInWithOtp({
            email,
            options: {
              emailRedirectTo: window.location.origin + '/login.html'
            }
          });
          if (error) throw error;
          setMessage('Check your email and click the login link.');
        } catch (err) {
          setMessage(err.message || 'Could not send login link.');
          showDebug('Email login failed', err);
        } finally {
          setBusy(false);
        }
      });

      googleBtn.addEventListener('click', async function(){
        try {
          setBusy(true);
          clearDebug();
          setMessage('Opening Google sign in...');
          const { error } = await supabase.auth.signInWithOAuth({
            provider: 'google',
            options: { redirectTo: window.location.origin + '/login.html' }
          });
          if (error) throw error;
        } catch (err) {
          setMessage(err.message || 'Could not open Google sign in.');
          setBusy(false);
          showDebug('Google login failed', err);
        }
      });

      forgotPasswordBtn.addEventListener('click', showForgot);
      backToLoginBtn.addEventListener('click', showLogin);

      resetSendBtn.addEventListener('click', async function(){
        const email = resetEmail.value.trim() || emailInput.value.trim();
        if (!email) { setMessage('Please enter your email address.'); return; }
        try {
          setBusy(true);
          clearDebug();
          setMessage('Sending password reset link...');
          const { error } = await supabase.auth.resetPasswordForEmail(email, {
            redirectTo: window.location.origin + '/login.html?type=recovery'
          });
          if (error) throw error;
          setMessage('Check your email for the password reset link.');
        } catch (err) {
          setMessage(err.message || 'Could not send reset link.');
          showDebug('Password reset failed', err);
        } finally {
          setBusy(false);
        }
      });

      savePasswordBtn.addEventListener('click', async function(){
        const p1 = newPassword.value;
        const p2 = confirmPassword.value;
        if (!p1 || p1.length < 8) { setMessage('Password must be at least 8 characters.'); return; }
        if (p1 !== p2) { setMessage('Passwords do not match.'); return; }

        try {
          setBusy(true);
          clearDebug();
          setMessage('Saving new password...');
          const { error } = await supabase.auth.updateUser({ password: p1 });
          if (error) throw error;
          setMessage('Password updated. Opening Hearty...');
          await sendToHome();
        } catch (err) {
          setMessage(err.message || 'Could not update password.');
          setBusy(false);
          showDebug('Password update failed', err);
        }
      });

      emailInput.addEventListener('keydown', function(e){ if (e.key === 'Enter') sendBtn.click(); });
      resetEmail.addEventListener('keydown', function(e){ if (e.key === 'Enter') resetSendBtn.click(); });
      confirmPassword.addEventListener('keydown', function(e){ if (e.key === 'Enter') savePasswordBtn.click(); });

      supabase.auth.onAuthStateChange(function(event, session){
        if (event === 'PASSWORD_RECOVERY') {
          hideSplash();
          setBusy(false);
          showNewPassword();
          return;
        }
        if (session && !redirecting && !recoveryMode) sendToHome();
      });

      setBusy(false);
      checkExistingSession();
    })();
  </script>
</body>
</html>
