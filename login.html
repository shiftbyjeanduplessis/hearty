<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Hearty Login</title>
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#0057ff">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Hearty">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/glp-supabase-config.js"></script>
  <style>
    :root{--login-ink:#102033;--login-muted:#5d6f7e;--login-line:rgba(180,200,220,.5);--login-card:rgba(255,255,255,.9);--login-blue:#1167d8;--login-blue-deep:#0756c8;--login-shadow:0 24px 70px rgba(50,80,110,.18)}
    *{box-sizing:border-box} body{margin:0;min-height:100vh;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:radial-gradient(900px 420px at 0% 0%,rgba(47,109,246,.10),transparent 55%),radial-gradient(900px 460px at 100% 100%,rgba(20,184,166,.09),transparent 55%),linear-gradient(180deg,#f7fbff,#eef5fb);display:flex;align-items:center;justify-content:center;padding:24px;color:var(--login-ink)}
    .auth-card{width:100%;max-width:430px;background:var(--login-card);border:1px solid var(--login-line);border-radius:30px;box-shadow:var(--login-shadow);padding:34px 26px 30px;text-align:center;backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px)}
    .auth-logo{height:64px;width:auto;max-width:300px;object-fit:contain;display:block;margin:0 auto 10px}.auth-tagline{font-size:.98rem;font-weight:650;color:var(--login-muted)}
    .auth-title{margin:14px 0 8px;font-size:1.9rem;line-height:1.05;font-weight:800;letter-spacing:-.04em}.subtitle{color:var(--login-muted);font-size:15px;margin-bottom:22px;line-height:1.5}
    input{width:100%;border-radius:16px;border:1px solid #d7e2ec;padding:15px 16px;font-size:16px;margin-bottom:14px;outline:none;background:rgba(255,255,255,.96);color:var(--login-ink)}
    input:focus{border-color:rgba(17,103,216,.45);box-shadow:0 0 0 4px rgba(17,103,216,.10)} button{width:100%;border:0;border-radius:16px;padding:15px 16px;font-size:16px;font-weight:700;cursor:pointer;margin-top:8px;transition:.18s ease}button:active{transform:scale(.985)}button:disabled{opacity:.55;cursor:not-allowed;transform:none}.primary{background:linear-gradient(180deg,var(--login-blue),var(--login-blue-deep));color:white;box-shadow:0 12px 24px rgba(17,103,216,.25)}.ghost{background:white;color:#123;border:1px solid #d7e2ec}.message{margin-top:18px;font-size:14px;color:var(--login-muted);min-height:22px;line-height:1.4}
    @media(max-width:560px){body{padding:18px}.auth-card{padding:30px 20px 26px;border-radius:28px}.auth-logo{height:56px}.auth-title{font-size:1.75rem}}
  </style>
</head>
<body>
  <main class="auth-card">
    <img src="/hearty-logo.png" alt="Hearty" class="auth-logo" />
    <div class="auth-tagline">Your GLP-1 Companion</div>
    <h1 class="auth-title">Welcome back</h1>
    <div class="subtitle">Sign in to continue your journey with Hearty.</div>
    <input id="email" type="email" placeholder="Email address" autocomplete="email" />
    <button class="primary" id="sendBtn" type="button">Continue with email</button>
    <button class="ghost" id="googleBtn" type="button">Continue with Google</button>
    <div class="message" id="message"></div>
  </main>

  <script>
    (function(){
      const emailInput = document.getElementById('email');
      const sendBtn = document.getElementById('sendBtn');
      const googleBtn = document.getElementById('googleBtn');
      const message = document.getElementById('message');
      const supabase = window.supabaseClient || window.heartySupabase;
      let redirecting = false;

      function setMessage(text){ message.textContent = text || ''; }
      function setBusy(isBusy){ sendBtn.disabled = isBusy; googleBtn.disabled = isBusy; }

      if (!supabase || !supabase.auth) {
        setMessage('Login connection failed. Check glp-supabase-config.js.');
        sendBtn.disabled = true;
        googleBtn.disabled = true;
        console.error('[Hearty Login] Missing Supabase client on window.');
        return;
      }

      async function ensureProfile(){
        try {
          const { data } = await supabase.auth.getUser();
          const user = data && data.user;
          if (!user) return;
          const provider = user.app_metadata?.provider || 'email';
          await supabase.from('profiles').upsert({
            user_id: user.id,
            account_email: user.email,
            user_name: user.user_metadata?.full_name || user.email || null,
            first_name: user.user_metadata?.full_name?.split(' ')?.[0] || null,
            auth_provider: provider,
            updated_at: new Date().toISOString()
          }, { onConflict: 'user_id' });
        } catch (err) { console.warn('[Hearty Login] Profile save skipped:', err); }
      }

      async function sendToHome(){
        if (redirecting) return;
        redirecting = true;
        setBusy(true);
        setMessage('Signing you in...');
        await ensureProfile();
        window.location.replace('/home.html');
      }

      async function handleRedirectSession(){
        try {
          if (window.location.search.includes('code=')) {
            await supabase.auth.exchangeCodeForSession(window.location.href);
          }
          for (let i = 0; i < 12; i++) {
            const { data } = await supabase.auth.getSession();
            if (data && data.session) return sendToHome();
            await new Promise(r => setTimeout(r, 250));
          }
        } catch (err) { console.warn('[Hearty Login] Redirect/session check failed:', err); }
      }

      sendBtn.addEventListener('click', async function(){
        const email = emailInput.value.trim();
        if (!email) { setMessage('Please enter your email address.'); return; }
        try {
          setBusy(true);
          setMessage('Sending login link...');
          const { error } = await supabase.auth.signInWithOtp({
            email,
            options: { emailRedirectTo: window.location.origin + '/login.html' }
          });
          if (error) throw error;
          setMessage('Check your email and click the login link.');
        } catch (err) {
          console.error('[Hearty Login] Email login failed:', err);
          setMessage(err.message || 'Could not send login link.');
        } finally { setBusy(false); }
      });

      googleBtn.addEventListener('click', async function(){
        try {
          setBusy(true);
          setMessage('Opening Google sign in...');
          const { error } = await supabase.auth.signInWithOAuth({
            provider: 'google',
            options: { redirectTo: window.location.origin + '/login.html' }
          });
          if (error) throw error;
        } catch (err) {
          console.error('[Hearty Login] Google login failed:', err);
          setMessage(err.message || 'Could not open Google sign in.');
          setBusy(false);
        }
      });

      emailInput.addEventListener('keydown', function(e){ if (e.key === 'Enter') sendBtn.click(); });
      supabase.auth.onAuthStateChange(function(_event, session){ if (session) sendToHome(); });
      handleRedirectSession();
    })();
  </script>
</body>
</html>
